services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: atchannel_db
    environment:
      POSTGRES_USER: atchannel_user
      POSTGRES_PASSWORD: atchannel_password
      POSTGRES_DB: atchannel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: atchannel_backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_USER=atchannel_user
      - DB_PASSWORD=atchannel_password
      - DB_NAME=atchannel_db
      - DB_PORT=5432
      - JWT_SECRET=fhdmSFpZ5VnolumrpbPoy92pG/nS9Ftmg1EDRpSKmCc=
      - ADMIN_NAME=admin
      - ADMIN_EMAIL=admin@channel.io
      - ADMIN_PASSWORD=admin1234
      # comma separated origins, "*" for any (tighten this in production)
      - CORS_ORIGINS=*
      # brute force protection: attempts per window per IP (register counts
      # every try, login counts only failures) + per-account failed login lock
      - RATE_LIMIT_MAX=10
      - RATE_LIMIT_WINDOW=1m
      - ACCOUNT_LOCK_MAX=5
      - ACCOUNT_LOCK_WINDOW=15m
    depends_on:
      - postgres

volumes:
  postgres_data:
