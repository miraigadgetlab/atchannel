# @channel nginx config
# Serves the built React frontend and reverse-proxies the API + file storage.
# Deployed inside the frontend container; proxy targets resolve via the
# podman network (backend service name "backend").

server {
    listen 80;
    server_name _;

    # Matches UPLOAD_MAX_BYTES in the backend (10 MiB default).
    client_max_body_size 10m;

    # Uploads must go to the backend unchanged.
    proxy_request_buffering off;

    # --- API reverse proxy ---
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Local file storage (STORAGE_LOCAL_URL=/files) ---
    location /files/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # --- Health check ---
    location = /healthz {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # --- Static frontend ---
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Assets are content-hashed by Vite: cache aggressively.
        location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|gif|ico)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        # index.html must never be cached (SPA entry, points at hashed assets).
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # SPA fallback for client-side routes.
        try_files $uri /index.html;
    }

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
