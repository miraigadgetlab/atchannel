# @channel production stack (podman-compose)
#
# Usage:
#   podman-compose -f deploy/podman-compose.yml up -d
#
# Services: postgres, redis, migrate (one-shot), backend (API), frontend (nginx serving static + proxy).

version: "3.9"

services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: atchannel-postgres
    environment:
      POSTGRES_USER: atchannel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: atchannel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atchannel -d atchannel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - atchannel-net

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: atchannel-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - atchannel-net

  migrate:
    image: atchannel-backend:latest
    container_name: atchannel-migrate
    environment:
      DATABASE_URL: postgres://atchannel:${POSTGRES_PASSWORD}@postgres:5432/atchannel?sslmode=disable
    entrypoint: ["/usr/local/bin/migrate", "-path", "/migrations", "-database", "postgres://atchannel:${POSTGRES_PASSWORD}@postgres:5432/atchannel?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - atchannel-net

  backend:
    image: atchannel-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: atchannel-backend
    environment:
      APP_ENV: production
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: postgres://atchannel:${POSTGRES_PASSWORD}@postgres:5432/atchannel?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: "true"
      REFRESH_COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://atchannel.top}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /data/storage
      STORAGE_LOCAL_URL: /files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    volumes:
      - uploads:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - atchannel-net

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: atchannel-frontend
    ports:
      - "8081:80"
      - "8443:443"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - atchannel-net

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  atchannel-net:
    name: atchannel-net
